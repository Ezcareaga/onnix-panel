  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    # Tag por SHA para poder volver atrás sin buildear:
    #   ONNIX_IMAGE_TAG=<sha12> docker compose -p onnix up -d --no-deps panel
    image: onnix-panel:${ONNIX_IMAGE_TAG:-latest}
    container_name: onnix-panel
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=onnix-postgres
      - TZ=America/Asuncion
      - GEO_DATA_PATH=/app/data/geografia
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      # Producción: activa fail-closed de verificación de firma de webhooks (E3).
      # Staging usa ENVIRONMENT=development en docker-compose.dev.yml.
      # NOTA: TRUST_PROXY_HEADERS (C1, IP real tras Cloudflare) NO se setea aquí a
      # propósito — debe activarse en .env JUNTO con el deploy de nginx realip
      # (docs/ops/NGINX_LOGIN_HARDENING.md), si no la IP de CF-Connecting-IP es
      # spoofeable hasta que nginx restrinja la confianza a rangos de Cloudflare.
      - ENVIRONMENT=production
    volumes:
      - ./data/geografia:/app/data/geografia:ro
      - /home/onnix/logs/prod:/app/logs
      - /home/onnix/images:/app/images:ro
      # Los MP4 de los tutoriales: estado del servidor, no codigo.
      # Se sirven en /videos (panel/app/main.py) y los lista /tutoriales.
      - /home/onnix/tutoriales:/app/tutoriales:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3.0"
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  n8n_data:
