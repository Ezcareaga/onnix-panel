# Se instala en /etc/systemd/system/webhook.service.d/override.conf
[Unit]
# La unit de Ubuntu no arranca sin /etc/webhook.conf. Nuestra config vive en
# /etc/onnixci/hooks.json, así que la condición se resetea y se reapunta.
ConditionPathExists=
ConditionPathExists=/etc/onnixci/hooks.json

[Service]
User=onnixci
Group=onnixci
ExecStart=
ExecStart=/usr/bin/webhook -nopanic -hooks /etc/onnixci/hooks.json -ip 127.0.0.1 -port 9000 -hotreload

NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/onnixci/queue
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallFilter=@system-service
SystemCallArchitectures=native
CapabilityBoundingSet=
MemoryMax=128M
TasksMax=64
