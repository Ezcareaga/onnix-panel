# Rotacion de los logs de Onnix SA.
#
# Se instala como drop-in:
#     sudo cp scripts/logrotate.conf /etc/logrotate.d/onnix
#     sudo logrotate -d /etc/logrotate.d/onnix    # simulacro, no rota nada
#
# Hasta el 2026-08-23 este archivo estaba versionado, un doc de verificacion lo
# daba por instalado (`.planning/phases/01-infrastructure/01-VERIFICATION.md`,
# «test -f /etc/logrotate.d/onnix … RESULT: PASS») y **no estaba en el
# servidor**. Nadie rotaba nada. Medido ese dia: 9,0 MB en total, con
# `gdrive_backup.log` en 1,1 MB creciendo todos los dias.
#
# Y apuntaba a `logs/bot/`, que no existe. Los directorios reales son audit,
# carrilj, dev, prod, scrapers y system — mas los `.log` sueltos en la raiz de
# `logs/`, que es justamente donde estan los que crecen. `missingok` cubre a los
# que aparezcan y desaparezcan; el glob de la raiz **no es recursivo**, asi que
# no pisa a los de los subdirectorios.
#
# Los logs NO se movieron con la reorganizacion del 18/08: siguen en el home,
# que es donde vive el estado del servidor. Lo que se movio fue el codigo.

# `logs/prod/` y `logs/dev/` NO estan aca, y es a proposito.
#
# El panel escribe `/app/logs/bot_v7.log` con un `RotatingFileHandler` propio
# —10 MB por 5 copias, `panel/app/bot/logging_config.py:125`— y ese path esta
# bind-mounteado desde `/home/onnix/logs/prod` y `/home/onnix/logs/dev`.
# Los dos directorios contienen **solo** ese archivo.
#
# Tenerlo tambien aca eran dos rotadores sobre el mismo archivo, y logrotate
# renombra **sin `copytruncate` y sin avisarle al proceso**: el fd abierto del
# contenedor sigue al inodo renombrado, asi que el bot escribiria adentro de
# `bot_v7.log.1` —que `delaycompress` gzipea en la corrida siguiente— y el
# `bot_v7.log` nuevo quedaria vacio para siempre. Los logs del bot se pierden
# sin que nada falle.
#
# No habia explotado: el drop-in se instalo el 23/08 y la corrida del 24/08
# 00:00 solo **registro** los dos archivos en `/var/lib/logrotate/status` sin
# rotarlos, que es lo que logrotate hace la primera vez que ve un archivo. La
# primera rotacion real caia el 25/08 00:00. Verificado el 24/08 a la 01:24: el
# archivo seguia creciendo en el mismo inodo adentro y afuera del contenedor.
#
# La regla, para cuando se agregue otro log: **un rotador por archivo**. Si lo
# rota el proceso, logrotate no lo toca; si lo toca logrotate, el proceso no lo
# rota.

/home/onnix/logs/*.log
/home/onnix/logs/audit/*.log
/home/onnix/logs/scrapers/*.log
/home/onnix/logs/system/*.log {
    # Sin esto logrotate NO rota NADA y lo dice en un `error:` que nadie lee:
    #
    #     error: skipping ".../scrapers/onnixpy.log" because parent
    #     directory has insecure permissions (It's world writable or writable
    #     by group which is not "root")
    #
    # `logs/` es 775 onnix:onnix — que es lo correcto, ahi escriben los
    # scrapers y el panel—, y logrotate se niega a rotar un directorio que no
    # es de root salvo que se le diga con que usuario hacerlo. Verificado en el
    # servidor el 2026-08-23: con el drop-in puesto y sin `su`, los cinco logs
    # de scrapers se saltearon uno por uno.
    su onnix onnix
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 onnix onnix
}
