# =============================================================================
# nginx_login_hardening_patch.conf — C1 (Real IP) + C2 (login rate-limit)
# Rama: fix/hardening-mi-cuenta-pre-m7
# Fecha de generación: 2026-06-13
# Runbook completo: docs/ops/NGINX_LOGIN_HARDENING.md
# Apply script:     scripts/apply_nginx_login_hardening.sh
# =============================================================================
#
# INSTRUCCIONES DE USO
# ---------------------
# Este archivo es un PATCH DE REFERENCIA — muestra exactamente qué agregar
# y dónde. NO se incluye en nginx directamente. El script de apply lo lee
# como fuente de verdad para los sed inserts.
#
# Leer el runbook ANTES de aplicar.
# =============================================================================


# =============================================================================
# BLOQUE 1 — http{} context  →  /etc/nginx/nginx.conf
# Agregar DESPUÉS de la línea existente:
#   limit_req_zone $binary_remote_addr zone=propiedades:10m rate=2r/s;
# (línea ~60 del nginx.conf actual del VPS)
# =============================================================================

# C2: Zona de rate-limit para /login (10 req/min por IP real post-C1)
# Nota: zone=login con rate=5r/m ya existe (línea 59) — si existe, el apply
# script la reemplaza por rate=10r/m para alinear con el umbral documentado.
# Si se prefiere mantener la zona existente, omitir ese paso y ajustar burst.
# El apply script detecta y actúa en consecuencia (ver sección 1b del script).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;


# =============================================================================
# BLOQUE 2 — server{} 443 context  →  /etc/nginx/sites-enabled/onnix
# Agregar DENTRO del server{} 443, ANTES del bloque "# Panel Admin (FastAPI)"
# (línea ~71 del archivo sites-enabled/onnix actual)
# =============================================================================

# --- C1: Cloudflare Real IP ---------------------------------------------------
# Rango de IPs de Cloudflare obtenidos el 2026-06-13 desde:
#   https://www.cloudflare.com/ips-v4/
#   https://www.cloudflare.com/ips-v6/
# Renovar cuando Cloudflare publique cambios (típicamente cada 6-12 meses).
# Lista canónica: https://www.cloudflare.com/ips-v4/ y /ips-v6/
# ---------------------------------------------------------
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
# Tras el bloque anterior, $remote_addr = IP REAL del visitante.
# Esto hace que $binary_remote_addr en limit_req_zone sea la IP real (C2 depende de C1).

# --- C2: Location /login rate-limited -----------------------------------------
# Bloque dedicado para /login — el resto de la app NO está throttleado.
# burst=5: permite hasta 5 req adicionales en cola antes de devolver 429.
# nodelay: no encola, rechaza inmediatamente superado el burst.
# Dependencia explícita: el bloque set_real_ip_from (C1) debe ejecutarse
# primero para que $binary_remote_addr sea la IP real del visitante, no la IP
# de un edge node de Cloudflare. Ambos bloques deben estar en el mismo server{}.
location = /login {
    limit_req zone=login_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}
