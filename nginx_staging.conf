# Staging — dev.onnix.com.py -> panel :8001 (contenedor onnix-panel-dev, DB onnix_dev)
#
# Hasta el 2026-08-22 NO existia un server block para dev.onnix.com.py: el
# subdominio caia en el `default_server` de produccion y servia el :8000, o sea
# que la URL documentada como staging mostraba produccion. El certificado de
# Let's Encrypt ya listaba dev.onnix.com.py como SAN; lo unico que faltaba era
# esto.
#
# Separado de produccion a proposito:
#   - los webhooks (/webhook/*, /hooks/onnix) devuelven 404 aca. Staging no
#     atiende un callback real de Twilio, Telegram ni GitHub, y el 404 lo hace
#     explicito en vez de depender de un guard de la app.
#   - X-Robots-Tag noindex en todo: staging no se indexa.
#   - sin limit_req: las zonas de rate limit son compartidas y el trafico de
#     prueba no debe gastar el presupuesto por IP de produccion.

server {
    listen 80;
    listen [::]:80;
    server_name dev.onnix.com.py;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.onnix.com.py;

    ssl_certificate     /etc/letsencrypt/live/onnix.com.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onnix.com.py/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare esta delante: sin esto $remote_addr seria el edge de CF y la
    # app registraria esa IP en cada login.
    include snippets/cloudflare-real-ip.conf;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Staging nunca atiende un callback externo.
    location /webhook/    { return 404; }
    location = /hooks/onnix { return 404; }

    # Landing estatica del worktree de staging: /srv/onnix/stage es el que el
    # pipeline deja en el mismo commit que corre el contenedor del :8001.
    location = / {
        alias /srv/onnix/stage/landing/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        default_type text/html;
    }

    location /landing-assets/ {
        alias /srv/onnix/stage/landing/assets/;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Las fotos son las mismas de produccion: solo lectura del disco.
    # Fotos de propiedades.
    #
    # El disco sigue organizado por portal de origen —es lo que escriben los
    # scrapers y lo que respalda el backup— pero **la URL no puede decirlo**: la
    # ficha pública se presenta como una publicación de Onnix SA, y
    # `/images/remax/143028064-85/1.webp` la delataba en el HTML, en la URL de
    # cada imagen y en el menú contextual del navegador.
    #
    # El alias lo arma `panel/app/utils/fotos.py`. Los cuatro `location` de acá
    # son la otra mitad: sin ellos la URL nueva da 404.
    #
    # NO hay un `location /images/` general a propósito: con él,
    # `/images/remax/...` seguiría resolviendo y el nombre seguiría siendo
    # alcanzable para el que lo pruebe.
    location ^~ /images/p1/ {
        alias /home/onnix/images/remax/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location ^~ /images/p2/ {
        alias /home/onnix/images/psir/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location ^~ /images/p3/ {
        alias /home/onnix/images/onnixpy/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location ^~ /images/p4/ {
        alias /home/onnix/images/coldwell/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location /conversations/sse {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        add_header X-Accel-Buffering no;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
