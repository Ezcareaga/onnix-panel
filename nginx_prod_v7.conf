# Produccion — onnix.com.py. Copia del /etc/nginx/sites-enabled/onnix vivo.
#
# Sincronizado el 2026-08-23 contra el servidor, y hasta ese dia mentia en dos
# cosas — las dos por quedarse atras, no por estar mal escritas:
#
#   1. Servia la landing desde `/home/onnix/landing/`, que **ya no existe**.
#      Se movio con la reorganizacion del 2026-08-18 («lo que es del servidor
#      vive en el home, lo que es del repo vive en /srv/onnix»). El vivo sirve
#      desde `/srv/onnix/prod/landing/`, y eso es lo que dice DEV_WORKFLOW.md.
#   2. **Le faltaba entero el `location = /hooks/onnix`**, el receptor de los
#      webhooks de GitHub. Restaurar nginx desde este archivo habria dejado el
#      pipeline sin disparador: ni staging ni prod se despliegan solos, y sin
#      un error visible — GitHub recibe un 404 y nadie mira.
#
# Un archivo de infraestructura que solo se lee cuando algo se rompio no puede
# estar viejo justo ese dia. Si se toca el vivo, se sincroniza aca.

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name onnix.com.py www.onnix.com.py _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name onnix.com.py www.onnix.com.py;

    # VPS nuevo (2026-08-17): cert de Let's Encrypt en vez de Cloudflare Origin CA.
    # El Origin CA del VPS viejo se perdio y regenerarlo pide acceso al dashboard de CF.
    # LE valida por HTTP-01 a traves del proxy de CF y sirve igual para Full (strict),
    # porque es publicamente confiable. Renovacion automatica via certbot.timer.
    ssl_certificate /etc/letsencrypt/live/onnix.com.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onnix.com.py/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- C1: Cloudflare Real IP -----------------------------------------------
    # Rango de IPs de Cloudflare obtenidos el 2026-06-13 desde:
    #   https://www.cloudflare.com/ips-v4/
    #   https://www.cloudflare.com/ips-v6/
    # Renovar periódicamente (lista canónica publicada por Cloudflare).
    # Tras este bloque, $remote_addr = IP REAL del visitante (no el edge de CF).
    # Esto también hace que $binary_remote_addr en limit_req sea la IP real (C2).
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    # --------------------------------------------------------------------------

    # Landing page — exact root only
    location = / {
        alias /srv/onnix/prod/landing/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        default_type text/html;
    }

    # Landing page assets (logo, etc.)
    location /landing-assets/ {
        alias /srv/onnix/prod/landing/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fotos de propiedades.
    #
    # El disco sigue organizado por portal de origen —es lo que escriben los
    # scrapers y lo que respalda el backup— pero **la URL no puede decirlo**: la
    # ficha pública se presenta como una publicación de Onnix SA, y
    # `/images/remax/143028064-85/1.webp` la delataba en el HTML, en la URL de
    # cada imagen y en el menú contextual del navegador.
    #
    # El alias lo arma `panel/app/utils/fotos.py`. Los cuatro `location` de acá
    # son la otra mitad: sin ellos la URL nueva da 404.
    #
    # NO hay un `location /images/` general a propósito: con él,
    # `/images/remax/...` seguiría resolviendo y el nombre seguiría siendo
    # alcanzable para el que lo pruebe.
    location ^~ /images/p1/ {
        alias /home/onnix/images/remax/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ^~ /images/p2/ {
        alias /home/onnix/images/psir/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ^~ /images/p3/ {
        alias /home/onnix/images/onnixpy/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ^~ /images/p4/ {
        alias /home/onnix/images/coldwell/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # SSE endpoint for real-time conversation updates
    location /conversations/sse {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        add_header X-Accel-Buffering no;
    }

    # --- C2: Login rate-limit -------------------------------------------------
    # 10 req/min por IP real (post-C1). burst=5 nodelay → 16ª req → 429.
    # Dependencia: set_real_ip_from (C1, arriba) debe resolver $remote_addr
    # antes de que limit_req aplique $binary_remote_addr. Ambos en server{}.
    # La zona login_limit se declara en /etc/nginx/nginx.conf http{} block.
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    # --------------------------------------------------------------------------

    # Portal publico M6.4b — rate-limit anti-scraper (2r/s + burst 10 por IP)
    location /propiedades {
        limit_req zone=propiedades burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
    }

    # Panel Admin (FastAPI)
    # CI/CD — receptor de webhooks de GitHub (ver .planning/CICD_PLAN.md).
    # La allowlist de IPs es defensa en profundidad; quien autentica es el HMAC
    # que valida `webhook` sobre X-Hub-Signature-256.
    location = /hooks/onnix {
        include snippets/github-hooks-allow.conf;
        proxy_pass http://127.0.0.1:9000/hooks/onnix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # FastAPI bot webhooks (v7 migration)
    location /webhook/telegram {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
    }

    location /webhook/whatsapp {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header CF-Connecting-IP    $http_cf_connecting_ip;
    }

    # Los bloques /webhook/ y /webhook-test/ que iban a n8n (127.0.0.1:5678) se
    # eliminaron el 2026-08-17: n8n fue descomisionado y no se reinstala en el VPS
    # nuevo. Sin esto, cualquier POST a /webhook/<algo> caia en un proxy_pass a un
    # puerto muerto y devolvia 502 en vez del 404 correcto.
    # Los webhooks vivos son /webhook/telegram y /webhook/whatsapp, arriba.
}
