# Zonas de rate-limit para Onnix — van en el http{} de nginx.
#
# Se instalan en /etc/nginx/conf.d/, que nginx.conf incluye DENTRO de http{}.
# Antes vivian editadas a mano en /etc/nginx/nginx.conf (ver
# scripts/apply_nginx_login_hardening.sh, que las insertaba con sed). Ese script
# sirve para parchear un server que ya las tenia; en una instalacion limpia sus
# anchors no existen. Un drop-in es idempotente y no toca nginx.conf.
#
# Las usa sites-enabled/onnix (nginx_prod_v7.conf):
#   location /propiedades → zone=propiedades   (anti-scraper del portal publico)
#   location = /login     → zone=login_limit   (anti fuerza bruta)
#
# $binary_remote_addr es la IP REAL del visitante solo porque el server{} 443
# declara set_real_ip_from con los rangos de Cloudflare (bloque C1). Sin eso,
# todos los visitantes comparten la IP del edge de CF y el limite es inutil.

limit_req_zone $binary_remote_addr zone=propiedades:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;
